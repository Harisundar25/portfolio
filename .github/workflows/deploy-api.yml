name: Deploy API (Azure App Service)

# Builds, tests and deploys backend/src/TranscriptAI.Api. Skipped until the repository variable
# AZURE_WEBAPP_NAME exists — see docs/DEPLOYMENT.md, step 3.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC sign-in to Azure, no stored passwords

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: backend
        run: dotnet test --solution TranscriptAI.slnx -c Release

      - name: Publish
        working-directory: backend
        run: dotnet publish src/TranscriptAI.Api/TranscriptAI.Api.csproj -c Release -o "${{ runner.temp }}/api"

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api

      - name: Smoke test
        if: vars.API_BASE_URL != ''
        # A Free-tier app restarts after a deploy; give it a couple of minutes to come up.
        run: curl --fail --silent --show-error --retry 12 --retry-delay 15 --retry-all-errors --max-time 60 "${{ vars.API_BASE_URL }}/api/health"
